<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extensionName">AI IMAGE BADGE</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark" aria-hidden="true">✦</span>
      <div>
        <div class="title-row">
          <h1 id="app-name" data-i18n="extensionName">AI IMAGE BADGE</h1>
          <span id="app-version" class="version">v…</span>
        </div>
        <p id="state" data-i18n="ui001">ページを確認しています…</p>
      </div>
    </header>
    <p id="page-url" class="page-url" data-i18n="ui002">URLを取得しています…</p>

    <label class="power-row">
      <span><b data-i18n="ui003">バッジ表示</b><small id="power-state" data-i18n="ui004">状態を確認中…</small></span>
      <input id="enabled-toggle" type="checkbox" role="switch" aria-label="バッジ表示のオン・オフ" data-i18n-aria-label="ui015">
    </label>

    <section class="counts" aria-label="検出結果" data-i18n-aria-label="ui016">
      <div><strong id="confirmed">…</strong><span data-i18n="ui005">AI判定</span></div>
      <div><strong id="likely">…</strong><span data-i18n="badgeMaybe">AIかも</span></div>
      <div><strong id="undetermined">…</strong><span data-i18n="badgeNonAi">非生成かも</span></div>
      <div><strong id="inspected">…</strong><span data-i18n="ui006">確認済み</span></div>
    </section>

    <p class="legend"><b data-i18n="ui005">AI判定</b> <span data-i18n="ui007">はOpenAI SynthID、生成AI由来のC2PA、またはモデル等による強い判定です。</span><b data-i18n="badgeMaybe">AIかも</b> <span data-i18n="ui008">は根拠が限定的・不一致・取得不能の結果、</span><b data-i18n="badgeNonAi">非生成かも</b> <span data-i18n="ui009">は生成AIの根拠が見つからない結果です。</span></p>
    <p id="model-note" class="network-note" data-i18n="ui010">ローカル画像モデル: 状態を確認中…</p>
    <p id="openai-note" class="network-note" hidden></p>
    <details id="openai-log" class="api-log" hidden>
      <summary data-i18n="ui011">OpenAI APIログ（現在のページ）</summary>
      <p data-i18n="ui012">画像やAPIキーはログに保存しません。ページの再読み込みまたは再確認で消去されます。</p>
      <ol id="openai-log-list"></ol>
    </details>
    <p id="network-note" class="network-note" hidden></p>

    <div class="actions">
      <button id="rescan" type="button" data-i18n="rescan">このページを再確認</button>
      <button id="options" type="button" class="secondary" data-i18n="ui013">設定</button>
      <button id="test-page" type="button" class="secondary full" data-i18n="ui014">テストページを開く</button>
    </div>
  </main>
  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
